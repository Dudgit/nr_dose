run_name: "PG+DB_config"
modelname: "DoTA"
batch_size: 256
inject_geometric_prior: False
inject_energy_field: True
drop_priors: False
ray_info: True
prior_mode: "full_line"
dotakwgs:
  use_fourier_embedding: True
  in_channels: 3

losskwgs:
  allMAE_weight: 1.
  masked_factor: 5.0
  iid_curve_weight: 0.001
  use_high_dose_mask: False
  bragg_peak_weight: 25.0


train:
  useGTPosInLearning: True
  useGeometricPrior: False
  useEnergyPrior: True
  num_epochs: 100
  lr: 2.8e-4
  adversarial:
    use: False
