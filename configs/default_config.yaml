run_name: "DoseAttentionUnet"
modelname: "DoseAttentionUnet"


data:
  dataset_list: "data/dataset_list.json"
  train_list: "data/train.json"
  val_list: "data/val.json"
  margin_slices: 15
  pixdim: [4.0, 4.0, 3.0]
  roi_size: [128, 128, 32]
  ct_min: -1024
  ct_max: 1500

  
dotakwgs:
  in_channels: 1
  out_channels: 1
  channels: [32, 64, 128, 256]
  num_heads: 8
  num_layers: 4

unetkwgs:
  condition_dim: 3

filmkwgs:
  condition_dim: 3

attentionkwgs:
  condition_dim: 3
  
losskwgs:
  masked_factor: 10.0
  iid_curve_weight: 5.
  allMAE_weight: 1.00

train:
  num_epochs: 50
