atlasz:
  num_workers: 12
  prefetch_factor: 2
  batch_size: 16 
  persistent_workers: True
  cache_dir: "/scratch/db/cache"
  dataset_type: "persistent"
  dataset_list: "data/dataset_list.json"
  train_list: "data/train.json"
  val_list: "data/val.json"
  run_name: "Fourier_energy_earlyRamp"
  modelname: "DoTA"
  sigma: 4.0
  margin_slices: 15
  pixdim: [4.0, 4.0, 3.0]
  roi_size: [128, 128, 32]
  ct_min: -1024
  ct_max: 2000
  prior_mode: "full_line"


    
  dotakwgs:
    in_channels: 3
    out_channels: 1
    channels: [32, 64, 128, 256]
    num_heads: 8
    num_layers: 4
    use_fourier_embedding: True

  unetkwgs:
    condition_dim: 3

  filmkwgs:
    condition_dim: 3

  attentionkwgs:
    condition_dim: 3
  
  losskwgs:
    masked_factor: 10.0
    iid_curve_weight: 0.5
    allMAE_weight: 0.50
    use_high_dose_mask: True
    high_dose_threshold: 0.8
    high_dose_weight: 5.0

  train:
    num_epochs: 100
    lr: 2.8e-4
    use_warmups: False
    fine_tune: False
    useEnergyPrior: True
    
    adversarial:
      use: True
      adv_weight: 0.1
      d_update_freq: 5
      start_epoch: 50
      ramp_length: 50
      max_mae_weight: 10.0
      def_mae_weight: 10.0
      useRamping: True
      earlyRamp: True


