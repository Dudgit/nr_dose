run_name: "DOTA_Phys_Prior_sigma_2.0"
modelname: "DoTA"
#? models [DoTA,ConditionalDoseUNet, FiLMConditionalDoseUnet,DoseAttentionUnet]


data:
  dataset_list: "data/dataset_list.json"
  train_list: "data/train.json"
  val_list: "data/val.json"
  margin_slices: 15
  pixdim: [4.0, 4.0, 3.0]
  roi_size: [128, 128, 32]
  ct_min: -1024
  ct_max: 2000
  sigma: 2.0 # Only in komondor, yet it might be changed in atlas too.

  
dotakwgs:
  in_channels: 2
  out_channels: 1
  channels: [32, 64, 128, 256]
  num_heads: 8
  num_layers: 4

unetkwgs:
  condition_dim: 3

filmkwgs:
  condition_dim: 3

attentionkwgs:
  condition_dim: 3
  
losskwgs:
  masked_factor: 10.0
  iid_curve_weight: 0.5
  allMAE_weight: 0.50
  total_variation_weight: 0.01

train:
  num_epochs: 50
  adversarial:
    use: False
    adv_weight: 0.1
    d_update_freq: 5
